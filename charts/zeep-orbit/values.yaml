# ── Global ──────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
replicaCount: 2

# ── Image ───────────────────────────────────────────────
image:
  repository: ghcr.io/zeeplabs/zeep-orbit
  tag: "latest"
  pullPolicy: Always
  # digest: "sha256:abc123..."   # pin para produção imutável
  pullSecrets: []

# ── Service ─────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80

# ── Ingress ─────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: orbit.zeeplabs.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zeep-orbit-tls
      hosts:
        - orbit.zeeplabs.com

# ── Autoscaling (HPA) ───────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# ── PodDisruptionBudget ─────────────────────────────────
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ── ServiceAccount ──────────────────────────────────────
serviceAccount:
  create: false
  name: ""
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456:role/zeep-orbit

# ── Security ────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# ── Topology Spread ─────────────────────────────────────
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway

# ── Node & Scheduling ───────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Pod Extra ───────────────────────────────────────────
podAnnotations: {}
podLabels: {}

# ── Resources ───────────────────────────────────────────
resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# ── Database ────────────────────────────────────────────
database:
  # Max Postgres connections per pod (DB_MAX_CONNS). Empty uses the app
  # default (10). Keep replicaCount × maxConns (+ HPA maxReplicas headroom)
  # under the server's max_connections.
  maxConns: ""

# ── Probes ──────────────────────────────────────────────
probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  # Readiness pings the database (/ready); liveness does not (/health), so a
  # database outage removes pods from the Service instead of restarting them.
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 2

# ── Secrets (obrigatório) ───────────────────────────────
secrets:
  # (obrigatório) PostgreSQL connection string
  databaseUrl: ""
  # (obrigatório) Secret usado no bootstrap inicial do dashboard
  dashboardBootstrapSecret: ""
  # google:
  #   clientId: "..."
  #   clientSecret: "..."
  #   redirectUrl: "https://orbit.zeeplabs.com/dashboard/api/auth/google/callback"
  #   allowedDomains: "zeeplabs.com, zeepfy.com"

# ── White-label branding ────────────────────────────────
brand:
  theme: "azure"
  companyName: "Zeep Tecnologia"

# ── Metrics ─────────────────────────────────────────────
# Prometheus-operator ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# ── AI Frontend Builder (opcional) ──────────────────────
# Off by default: with builder.enabled=false the chart renders no builder
# object and the Orbit pods get no BUILDER_* env (the feature stays off).
# The builder runs generated, untrusted code. Isolation is enforced by:
#   - NetworkPolicy (needs a CNI that enforces them: Calico, Cilium, ...):
#     the builder may only receive from the Orbit pods and only talk to the
#     registry proxy (and DNS); the proxy is the only pod with egress.
#   - no service account token, read-only root fs, all capabilities dropped.
# The builder keeps session workspaces on a PVC and is a single replica
# (ReadWriteOnce, Recreate); session state is also snapshotted in Postgres.
builder:
  enabled: false
  # (obrigatório quando enabled) Shared HMAC secret between Orbit and the
  # builder, >= 16 bytes. Prefer an existing Secret over a plain value.
  sharedSecret: ""
  existingSecret: ""            # Secret with key BUILDER_SHARED_SECRET
  image:
    repository: ghcr.io/zeeplabs/zeep-orbit-builder
    tag: ""                     # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2"
  persistence:
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  networkPolicy:
    enabled: true
  registryProxy:
    image:
      repository: ghcr.io/zeeplabs/zeep-orbit-registry-proxy
      tag: ""
      pullPolicy: IfNotPresent
    # Comma separated npm upstreams (REGISTRY_PROXY_UPSTREAMS).
    upstreams: "https://registry.npmjs.org"
    # Optional bearer tokens for private upstreams (kept in the chart Secret).
    tokenDefault: ""
    tokenCompany: ""
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "500m"
