# npm registry proxy: the only pod the builder can talk to, and the only one
# with egress (see networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeep-orbit-registry-proxy
  labels:
    app: zeep-orbit-registry-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeep-orbit-registry-proxy
  template:
    metadata:
      labels:
        app: zeep-orbit-registry-proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry-proxy
          image: ghcr.io/zeeplabs/zeep-orbit-registry-proxy:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 4873
              protocol: TCP
          env:
            - name: REGISTRY_PROXY_ADDR
              value: ":4873"
            - name: REGISTRY_PROXY_UPSTREAMS
              value: "https://registry.npmjs.org"
            - name: REGISTRY_PROXY_TOKEN_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: zeep-orbit-builder-secret
                  key: REGISTRY_PROXY_TOKEN_DEFAULT
                  optional: true
            - name: REGISTRY_PROXY_TOKEN_COMPANY
              valueFrom:
                secretKeyRef:
                  name: zeep-orbit-builder-secret
                  key: REGISTRY_PROXY_TOKEN_COMPANY
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zeep-orbit-registry-proxy
  labels:
    app: zeep-orbit-registry-proxy
spec:
  type: ClusterIP
  selector:
    app: zeep-orbit-registry-proxy
  ports:
    - name: http
      port: 4873
      targetPort: http
      protocol: TCP
