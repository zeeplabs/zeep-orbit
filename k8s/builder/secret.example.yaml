# TEMPLATE ONLY — NÃO COMMITAR COM VALORES REAIS.
# Criar o Secret fora do GitOps:
#
#   kubectl create secret generic zeep-orbit-builder-secret \
#     --from-literal=BUILDER_SHARED_SECRET="$(openssl rand -hex 32)"
#
# BUILDER_SHARED_SECRET: >= 16 bytes, shared by Orbit and the builder.
# Optional private-upstream tokens for the registry proxy:
#   --from-literal=REGISTRY_PROXY_TOKEN_DEFAULT=... --from-literal=REGISTRY_PROXY_TOKEN_COMPANY=...
#
# Alternativas GitOps-safe: SealedSecrets, SOPS/age, External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: zeep-orbit-builder-secret
  labels:
    app: zeep-orbit-builder
type: Opaque
stringData:
  BUILDER_SHARED_SECRET: "change-me-at-least-16-bytes"
