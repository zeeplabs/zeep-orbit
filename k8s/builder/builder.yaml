# The builder runs generated, untrusted code: no service account token, no
# service links, read-only root fs, all capabilities dropped. Its own `app`
# label keeps it out of the zeep-orbit Service. One replica: the workspaces
# live on a ReadWriteOnce volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zeep-orbit-builder
  labels:
    app: zeep-orbit-builder
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeep-orbit-builder
  labels:
    app: zeep-orbit-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zeep-orbit-builder
  template:
    metadata:
      labels:
        app: zeep-orbit-builder
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: builder
          # Para produção, pin por digest imutável.
          image: ghcr.io/zeeplabs/zeep-orbit-builder:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: BUILDER_ADDR
              value: ":8081"
            - name: BUILDER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: zeep-orbit-builder-secret
                  key: BUILDER_SHARED_SECRET
            - name: BUILDER_WORK_DIR
              value: /work
            - name: BUILDER_TEMPLATES_DIR
              value: /opt/templates
            - name: BUILDER_NPM_REGISTRY
              value: "http://zeep-orbit-registry-proxy:4873"
            - name: BUILDER_HOME
              value: /tmp
            - name: BUILDER_NPM_CACHE
              value: /work/.npm-cache
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
          # The daemon rejects every unsigned request, so probes are TCP connects.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: zeep-orbit-builder
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zeep-orbit-builder
  labels:
    app: zeep-orbit-builder
spec:
  type: ClusterIP
  selector:
    app: zeep-orbit-builder
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
