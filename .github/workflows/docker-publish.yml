name: Docker Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/reusable-ci.yml

  build-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          helm package charts/zeep-orbit --version "$VERSION" --app-version "$VERSION" --destination .helm-packages

      - name: Prepare release body
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          NOTES_FILE=".github/release-notes-${VERSION}.md"
          OUT="release-body.md"

          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$OUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${NOTES_FILE} not found — falling back to GitHub's auto-generated notes. See RELEASE.md step 4."
            > "$OUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo ""
            echo "## Docker image"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}"
            echo '```'
            echo ""
            echo "## Helm chart"
            echo ""
            echo '```bash'
            echo "helm repo add zeeplabs https://zeeplabs.github.io/zeep-orbit/helm"
            echo "helm install zeep-orbit zeeplabs/zeep-orbit"
            echo '```'
          } >> "$OUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: .helm-packages/*.tgz
          body_path: release-body.md
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
