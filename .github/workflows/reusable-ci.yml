name: Reusable CI

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zeep_test?sslmode=disable
      DASHBOARD_BOOTSTRAP_SECRET: ci-test-bootstrap-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Dashboard UI
        run: |
          cd internal/dashboard/ui
          npm install
          npx tsc -b
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Go test
        # -p 1: several packages (internal/dashboard, internal/server, ...)
        # share the one TEST_DATABASE_URL and some tests drop+recreate the
        # zeep_system schema for isolation — running packages in parallel
        # races on that schema and flakes. Sequential package execution
        # avoids it; tests within a package still run concurrently.
        #
        # -parallel 4: each real-DB test opens its own db.Pool (MaxConns=10).
        # Unbounded intra-package parallelism can open enough pools at once
        # to exceed this Postgres service's max_connections (100, vs. 300 on
        # local dev DBs), which then fails every subsequent test in the run
        # with "sorry, too many clients already" regardless of package.
        # Capping concurrent subtests keeps peak connections well under 100.
        run: go test -p 1 -parallel 4 ./...

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeep_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zeep_e2e?sslmode=disable
      DASHBOARD_BOOTSTRAP_SECRET: ci-test-bootstrap-secret-not-for-prod
      BOOTSTRAP_SECRET: ci-test-bootstrap-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Dashboard UI
        run: |
          cd internal/dashboard/ui
          npm install
          npx tsc -b
          npm run build

      - name: Build zeep binary
        run: go build -o /tmp/zeep-e2e ./cmd/zeep

      - name: Install Playwright browsers
        run: |
          cd internal/dashboard/ui
          npx playwright install --with-deps chromium

      # Each project runs against its own freshly started server: the
      # backend's login rate limiter (5/min per IP, internal/server/server.go
      # `authLimiter`) trips when every project's tests log in from the same
      # runner IP back-to-back — a real, intentional security control we
      # don't weaken for CI's convenience. Restarting the server per project
      # resets its in-memory limiter state, matching the workaround already
      # used for local runs (see .specs/features/responsive-layout/validation.md).
      - name: Run Playwright projects
        run: |
          set -e
          cd internal/dashboard/ui
          for project in chromium mobile tablet ultrawide; do
            echo "::group::Playwright project: $project"
            /tmp/zeep-e2e serve --port 8090 &
            server_pid=$!
            for i in $(seq 1 30); do
              curl -sf http://localhost:8090/dashboard/api/bootstrap/status > /dev/null && break
              sleep 1
            done
            BASE_URL=http://localhost:8090 npx playwright test --project="$project"
            kill "$server_pid"
            wait "$server_pid" 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: internal/dashboard/ui/playwright-report/
          retention-days: 7
