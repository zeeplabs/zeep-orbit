name: Reusable CI

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zeep_test?sslmode=disable
      DASHBOARD_BOOTSTRAP_SECRET: ci-test-bootstrap-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Dashboard UI
        run: |
          cd internal/dashboard/ui
          npm install
          npx tsc -b
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Go test
        # -p 1: several packages (internal/dashboard, internal/server, ...)
        # share the one TEST_DATABASE_URL and some tests drop+recreate the
        # zeep_system schema for isolation — running packages in parallel
        # races on that schema and flakes. Sequential package execution
        # avoids it; tests within a package still run concurrently.
        #
        # -parallel 4: each real-DB test opens its own db.Pool (MaxConns=10).
        # Unbounded intra-package parallelism can open enough pools at once
        # to exceed this Postgres service's max_connections (100, vs. 300 on
        # local dev DBs), which then fails every subsequent test in the run
        # with "sorry, too many clients already" regardless of package.
        # Capping concurrent subtests keeps peak connections well under 100.
        run: go test -p 1 -parallel 4 ./...
