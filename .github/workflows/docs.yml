name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/setup-helm@v4

      - name: Build Docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Package Helm chart
        run: |
          helm package charts/zeep-orbit --destination docs/build/helm

      - name: Generate Helm repo index
        run: |
          helm repo index docs/build/helm --url https://zeeplabs.github.io/zeep-orbit/helm

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
